services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ai_customer_service
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6380:6379"

  # 向量库：Chroma 1.5.9（独立服务，数据落 chroma-data 卷）
  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/data

  app:
    build: .
    # 加法：仅 loopback 暴露（本地 dev proxy / 验收脚本可用），不对公网开放；
    # 生产可整段删除 ports，nginx 经 docker 内部网络访问 app:8080
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_customer_service?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-123456}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      # 硅基流动 bge-m3 向量化所需的 Key
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      # 容器内访问 Chroma 用服务名，localhost 指的是 app 自己
      CHROMA_HOST: http://chroma
    volumes:
      # 加法：复用宿主机 ONNX 模型与 DJL 原生库缓存，避免重建容器重复下载
      - ${USERPROFILE:-/tmp}/.cache/spring-ai-onnx:/root/.cache/spring-ai-onnx
      - ${USERPROFILE:-/tmp}/.djl.ai:/root/.djl.ai
    depends_on:
      mysql:
        condition: service_healthy
      chroma:
        condition: service_started

  # 加法：统一入口。/ 托管前端 dist，/api/ 反代 app:8080/ai/（见 deploy/nginx.conf）
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx-proxy.inc:/etc/nginx/nginx-proxy.inc:ro
    depends_on:
      - app

volumes:
  mysql-data:
  chroma-data: