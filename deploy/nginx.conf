# 统一入口：/ 托管前端 dist（history 路由），/api/ 反代后端 /ai/（SSE 友好）
# 挂载点：/etc/nginx/conf.d/default.conf（docker-compose.yml nginx 服务）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 当前无文件上传接口；预留 JSON/未来上传余量
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Vite 哈希资源：长缓存 + immutable
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口不缓存，保证发版即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA history 路由：刷新 /chat、/admin/orders 等不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 统一 API 入口：/api/xxx -> 后端 /ai/xxx（保留方法/头/Cookie/查询串）
    location /api/ {
        proxy_pass http://app:8080/ai/;
        include /etc/nginx/nginx-proxy.inc;
    }

    # 过渡兼容别名（旧同域路径 /ai/），前端全量切 /api 后可删除本段
    location /ai/ {
        proxy_pass http://app:8080/ai/;
        include /etc/nginx/nginx-proxy.inc;
    }

    # 运维端点不对外：仅容器内/loopback 可达
    location /actuator {
        return 403;
    }
}